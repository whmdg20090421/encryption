name: Build arm64-v8a Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret KEYSTORE_B64 is empty."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/release-keystore.jks
          ls -la app/release-keystore.jks
          file app/release-keystore.jks || true

      - name: Build Release APK (arm64-v8a only)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew clean :app:assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: locate
        run: |
          APK=$(find app/build/outputs/apk/release -name '*arm64-v8a*release*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::warning::Did not find ABI-tagged file. Falling back to any release apk."
            APK=$(find app/build/outputs/apk/release -name '*release*.apk' | head -n 1)
          fi
          if [ -z "$APK" ]; then
            echo "::error::No APK produced!"
            ls -la app/build/outputs/apk/release || true
            exit 1
          fi
          echo "Apk path: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        run: |
          BUILD_TOOLS_DIR=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_DIR/apksigner"
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "${{ steps.locate.outputs.apk_path }}" || true

      - name: Rename APK with dynamic version
        id: rename
        run: |
          ORIGINAL="${{ steps.locate.outputs.apk_path }}"
          DIR=$(dirname "$ORIGINAL")

          # Extract versionName directly from the APK manifest
          BUILD_TOOLS_DIR=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          AAPT2="$ANDROID_HOME/build-tools/$BUILD_TOOLS_DIR/aapt2"
          FULL_VERSION=$("$AAPT2" dump badging "$ORIGINAL" 2>/dev/null \
            | grep -o "versionName='[^']*'" | cut -d"'" -f2)

          if [ -z "$FULL_VERSION" ]; then
            echo "::warning::Could not extract versionName, falling back to 'unknown'"
            FULL_VERSION="unknown"
          fi

          # Take only the major.minor part (e.g. "1.3.12345" → "1.3")
          VERSION_MAJOR_MINOR=$(echo "$FULL_VERSION" | cut -d. -f1-2)

          TIMESTAMP=$(date +"%Y%m%d-%H%M")
          NEW_NAME="工具箱-v${VERSION_MAJOR_MINOR}-${TIMESTAMP}-arm64-v8a-release.apk"
          cp "$ORIGINAL" "${DIR}/${NEW_NAME}"
          echo "apk_path=${DIR}/${NEW_NAME}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION_MAJOR_MINOR} (full: ${FULL_VERSION})"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 工具箱-arm64-v8a-release
          path: ${{ steps.rename.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
